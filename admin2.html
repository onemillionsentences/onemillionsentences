<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — One Million Sentences</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Segoe UI',sans-serif;background:#f5f4f0;color:#1a1a1a;}
.header{background:#1a1a1a;color:#fff;padding:16px 32px;display:flex;justify-content:space-between;align-items:center;}
.header h1{font-size:18px;font-weight:700;}
.header span{color:#c9a84c;font-size:13px;}
.stats{display:flex;gap:16px;padding:24px 32px;flex-wrap:wrap;}
.stat{background:#fff;border-radius:12px;padding:16px 24px;flex:1;min-width:130px;border:1px solid #e8e6e0;}
.stat .n{font-size:28px;font-weight:800;}
.stat .l{font-size:12px;color:#888;margin-top:4px;}
.main{padding:0 32px 40px;}
.tabs{display:flex;gap:8px;margin-bottom:20px;}
.tab{padding:8px 20px;border-radius:100px;border:none;cursor:pointer;font-size:13px;font-weight:600;background:#e8e6e0;color:#555;}
.tab.active{background:#1a1a1a;color:#fff;}
.card{background:#fff;border-radius:14px;padding:20px 24px;margin-bottom:14px;border:1px solid #e8e6e0;}
.sentence{font-size:16px;font-weight:600;margin-bottom:8px;line-height:1.5;}
.meta{font-size:12px;color:#888;margin-bottom:12px;}
.meta span{margin-right:14px;}
.badge{display:inline-block;padding:3px 10px;border-radius:100px;font-size:11px;font-weight:700;margin-right:6px;}
.b-pending{background:#fff8e0;color:#b8860b;}
.b-approved{background:#e6f9ee;color:#1a7a40;}
.b-rejected{background:#fde8e8;color:#c0392b;}
.b-founder{background:#1a1a1a;color:#c9a84c;}
.btns{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap;}
.btn{padding:8px 18px;border-radius:8px;border:none;cursor:pointer;font-size:13px;font-weight:600;}
.btn-ok{background:#1a7a40;color:#fff;}
.btn-no{background:#c0392b;color:#fff;}
.btn-undo{background:#888;color:#fff;}
.rbox{margin-top:12px;padding:12px;background:#fff8f8;border-radius:8px;border:1px solid #f5c6c6;display:none;}
.rbox.open{display:block;}
.rbox label{font-size:12px;font-weight:600;color:#c0392b;display:block;margin-bottom:8px;}
.reasons{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px;}
.rb{padding:5px 12px;border-radius:100px;border:1px solid #e0d0d0;background:#fff;cursor:pointer;font-size:12px;}
.rb.sel{background:#c0392b;color:#fff;border-color:#c0392b;}
.conf{background:#c0392b;color:#fff;padding:8px 20px;border-radius:8px;border:none;cursor:pointer;font-size:13px;font-weight:600;}
.empty{text-align:center;padding:60px 20px;color:#aaa;}
.empty .icon{font-size:48px;margin-bottom:12px;}
.nav{display:flex;gap:0;margin-bottom:28px;border-bottom:2px solid #e8e6e0;}
.nb{padding:12px 24px;border:none;background:none;cursor:pointer;font-size:14px;font-weight:600;color:#888;border-bottom:3px solid transparent;margin-bottom:-2px;}
.nb.active{color:#1a1a1a;border-bottom-color:#c9a84c;}
table{width:100%;border-collapse:collapse;background:#fff;border-radius:12px;overflow:hidden;border:1px solid #e8e6e0;}
th{background:#f5f4f0;padding:12px 16px;text-align:left;font-size:12px;font-weight:700;color:#888;text-transform:uppercase;}
td{padding:12px 16px;font-size:13px;border-top:1px solid #f0eeea;}
.toast{position:fixed;bottom:24px;right:24px;padding:12px 20px;border-radius:10px;font-size:14px;font-weight:600;display:none;z-index:999;color:#fff;}
.toast.show{display:block;}
.ts{background:#1a7a40;}
.te{background:#c0392b;}
</style>
</head>
<body>
<div class="header">
  <h1>⚡ One Million Sentences — Admin</h1>
  <span id="hdr">Loading...</span>
</div>
<div class="stats">
  <div class="stat"><div class="n" id="sp">0</div><div class="l">⏳ Pending</div></div>
  <div class="stat"><div class="n" id="sa">0</div><div class="l">✅ Approved</div></div>
  <div class="stat"><div class="n" id="sr">0</div><div class="l">❌ Rejected</div></div>
  <div class="stat"><div class="n" id="sm">0</div><div class="l">👥 Members</div></div>
</div>
<div class="main">
  <div class="nav">
    <button class="nb active" onclick="showPage('s',this)">📋 Review Sentences</button>
    <button class="nb" onclick="showPage('m',this)">👥 All Members</button>
  </div>
  <div id="pg-s">
    <div class="tabs">
      <button class="tab active" onclick="setTab('pending',this)">⏳ Pending</button>
      <button class="tab" onclick="setTab('approved',this)">✅ Approved</button>
      <button class="tab" onclick="setTab('rejected',this)">❌ Rejected</button>
      <button class="tab" onclick="setTab('all',this)">All</button>
    </div>
    <div id="slist"><div class="empty"><div class="icon">⏳</div><p>Loading...</p></div></div>
  </div>
  <div id="pg-m" style="display:none;">
    <div style="font-size:20px;font-weight:700;margin-bottom:16px;">All Members</div>
    <div id="mlist"><div class="empty"><div class="icon">⏳</div><p>Loading...</p></div></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
// PASSWORD
(function(){
  const P='MillionAdmin2026!';
  if(sessionStorage.getItem('adm')!=='1'){
    const i=prompt('🔒 Admin Password:');
    if(i!==P){document.body.innerHTML='<div style="display:flex;align-items:center;justify-content:center;height:100vh;font-size:20px;color:#c0392b;">❌ Access Denied</div>';throw new Error('x');}
    sessionStorage.setItem('adm','1');
  }
})();

const SB = supabase.createClient(
  'https://getebatmpkrfhgkqxdig.supabase.co',
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdldGViYXRtcGtyZmhna3F4ZGlnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk1ODYyODUsImV4cCI6MjA5NTE2MjI4NX0.VrD4PNpkFXeeiXpKIipgs6lSdwoTyTPHXuqZR3AzNCA'
);

let sentences=[], members=[], tab='pending', openId=null;

async function load(){
  const {data:s, error:e1} = await SB.from('sentences').select('*').order('id',{ascending:false});
  const {data:m, error:e2} = await SB.from('contributors').select('*').order('id',{ascending:true});

  if(e1){document.getElementById('slist').innerHTML='<div class="empty"><div class="icon">⚠️</div><p>Error: '+e1.message+'</p></div>';return;}
  if(e2){document.getElementById('slist').innerHTML='<div class="empty"><div class="icon">⚠️</div><p>Error: '+e2.message+'</p></div>';return;}

  sentences = s||[];
  members   = m||[];
  stats();
  renderS();
  renderM();
}

function stats(){
  const p=sentences.filter(x=>x.status==='pending').length;
  const a=sentences.filter(x=>x.status==='approved').length;
  const r=sentences.filter(x=>x.status==='rejected').length;
  document.getElementById('sp').textContent=p;
  document.getElementById('sa').textContent=a;
  document.getElementById('sr').textContent=r;
  document.getElementById('sm').textContent=members.length;
  document.getElementById('hdr').textContent=p+' pending review';
}

function getMember(id){return members.find(m=>m.id===id)||{};}

function renderS(){
  const list = tab==='all' ? sentences : sentences.filter(x=>x.status===tab);
  const c = document.getElementById('slist');
  if(!list.length){
    c.innerHTML='<div class="empty"><div class="icon">'+(tab==='pending'?'🎉':'🔍')+'</div><p>'+(tab==='pending'?'No pending sentences!':'No sentences here.')+'</p></div>';
    return;
  }
  c.innerHTML = list.map(s=>{
    const m=getMember(s.contributor_id);
    const d=s.created_at?new Date(s.created_at).toLocaleDateString('en',{month:'short',day:'numeric',year:'numeric'}):'';
    const btns = s.status==='pending'
      ? `<button class="btn btn-ok" onclick="approve(${s.id})">✅ Approve</button><button class="btn btn-no" onclick="openR(${s.id})">❌ Reject</button>`
      : `<button class="btn btn-undo" onclick="reset(${s.id})">↩️ Reset</button>`;
    const rr = s.rejection_reason?`<div style="margin-top:8px;font-size:12px;color:#c0392b;">Reason: ${s.rejection_reason}</div>`:'';
    return `<div class="card" id="c${s.id}">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;">
        <div class="sentence">"${s.sentence_text}"</div>
        <div><span class="badge b-${s.status}">${s.status}</span><span class="badge b-founder">${m.is_paid?'💳 Paid':'👑 Founder'}</span></div>
      </div>
      <div class="meta"><span>👤 ${m.display_name||'?'}</span><span>✉️ ${m.email||''}</span><span>🌍 ${m.country||''}</span><span>📅 ${d}</span></div>
      <div class="btns">${btns}</div>
      <div class="rbox" id="r${s.id}">
        <label>Select reason:</label>
        <div class="reasons">
          <button class="rb" onclick="selR(this)">⛪ Religious</button>
          <button class="rb" onclick="selR(this)">🏛 Political</button>
          <button class="rb" onclick="selR(this)">🔞 Adult</button>
          <button class="rb" onclick="selR(this)">🤬 Offensive</button>
          <button class="rb" onclick="selR(this)">📋 Plagiarism</button>
          <button class="rb" onclick="selR(this)">🌐 Not English</button>
          <button class="rb" onclick="selR(this)">📏 Too short</button>
        </div>
        <button class="conf" onclick="doReject(${s.id})">Confirm Rejection</button>
      </div>
      ${rr}
    </div>`;
  }).join('');
}

function renderM(){
  const c=document.getElementById('mlist');
  if(!members.length){c.innerHTML='<div class="empty"><div class="icon">👥</div><p>No members.</p></div>';return;}
  c.innerHTML=`<table><thead><tr><th>#</th><th>Name</th><th>Email</th><th>Country</th><th>Type</th><th>Ref</th></tr></thead><tbody>
    ${members.map((m,i)=>`<tr><td>${i+1}</td><td><b>${m.display_name||''}</b></td><td>${m.email||''}</td><td>${m.country||''}</td><td><span class="badge ${m.is_paid?'b-approved':'b-founder'}">${m.is_paid?'💳 Paid':'👑 Founder'}</span></td><td><code>${m.ref_code||''}</code></td></tr>`).join('')}
  </tbody></table>`;
}

async function approve(id){
  const {error}=await SB.from('sentences').update({status:'approved',rejection_reason:null}).eq('id',id);
  if(!error){sentences.find(x=>x.id===id).status='approved';stats();renderS();toast('✅ Approved!','ts');}
  else toast('Error: '+error.message,'te');
}

function openR(id){
  if(openId&&openId!==id){const p=document.getElementById('r'+openId);if(p)p.classList.remove('open');}
  openId=id;
  const b=document.getElementById('r'+id);
  if(b)b.classList.toggle('open');
}

function selR(btn){
  btn.closest('.reasons').querySelectorAll('.rb').forEach(b=>b.classList.remove('sel'));
  btn.classList.add('sel');
}

async function doReject(id){
  const box=document.getElementById('r'+id);
  const sel=box.querySelector('.rb.sel');
  const reason=sel?sel.textContent.trim():'Rejected by admin';
  const {error}=await SB.from('sentences').update({status:'rejected',rejection_reason:reason}).eq('id',id);
  if(!error){const s=sentences.find(x=>x.id===id);s.status='rejected';s.rejection_reason=reason;stats();renderS();toast('❌ Rejected.','te');}
  else toast('Error: '+error.message,'te');
}

async function reset(id){
  const {error}=await SB.from('sentences').update({status:'pending',rejection_reason:null}).eq('id',id);
  if(!error){const s=sentences.find(x=>x.id===id);s.status='pending';s.rejection_reason=null;stats();renderS();toast('↩️ Reset.','ts');}
}

function setTab(t,btn){tab=t;document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));btn.classList.add('active');renderS();}

function showPage(p,btn){
  document.getElementById('pg-s').style.display=p==='s'?'':'none';
  document.getElementById('pg-m').style.display=p==='m'?'':'none';
  document.querySelectorAll('.nb').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
}

function toast(msg,cls){const t=document.getElementById('toast');t.textContent=msg;t.className='toast show '+cls;setTimeout(()=>t.classList.remove('show'),3500);}

load();
</script>
</body>
</html>
